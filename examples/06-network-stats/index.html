<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>06 – Network Stats | Red5 Pro Conference SDK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; padding: 24px; }
    h1 { font-size: 1.25rem; margin-bottom: 4px; }
    p.subtitle { color: #8b949e; font-size: 0.875rem; margin-bottom: 24px; }

    .config { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 640px; margin-bottom: 20px; }
    label { font-size: 0.8rem; color: #8b949e; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 10px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 0.875rem; }

    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
    button { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 600; transition: opacity .15s; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #btn-join  { background: #238636; color: #fff; }
    #btn-leave { background: #da3633; color: #fff; }

    video { width: 240px; height: 135px; background: #161b22; border-radius: 8px; object-fit: cover; display: block; margin-bottom: 20px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; max-width: 860px; margin-bottom: 24px; }
    .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; }
    .stat-card .name { font-size: 0.75rem; color: #8b949e; margin-bottom: 6px; }
    .stat-card .value { font-size: 1.4rem; font-weight: 700; font-family: monospace; }
    .stat-card .unit  { font-size: 0.7rem; color: #8b949e; margin-left: 4px; }
    .good   { color: #3fb950; }
    .warn   { color: #f0883e; }
    .bad    { color: #f85149; }

    #quality-bar { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; max-width: 860px; margin-bottom: 24px; }
    #quality-bar h3 { font-size: 0.8rem; color: #8b949e; margin-bottom: 10px; }
    .bar-track { height: 8px; background: #30363d; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; background: #3fb950; border-radius: 4px; transition: width .4s, background .4s; }

    #issues-box { background: #3d1414; border: 1px solid #f85149; border-radius: 8px; padding: 12px 16px; max-width: 860px; margin-bottom: 20px; display: none; }
    #issues-box h3 { font-size: 0.8rem; color: #f85149; margin-bottom: 8px; }
    #issues-list { font-size: 0.8rem; color: #ff5555; }

    #log { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.78rem; }
    .log-info    { color: #8be9fd; }
    .log-success { color: #50fa7b; }
    .log-error   { color: #ff5555; }
    .log-warn    { color: #f0883e; }
  </style>
</head>
<body>
  <h1>06 – Network Stats</h1>
  <p class="subtitle">Monitor real-time WebRTC connection quality: bitrate, RTT, packet loss, and jitter.</p>

  <div class="config">
    <div><label>Host</label><input id="host" placeholder="your-deployment.cloud.red5.net" /></div>
    <div><label>Room ID</label><input id="room-id" value="testroom" /></div>
    <div><label>User ID</label><input id="user-id" placeholder="alice" /></div>
    <div><label>Token</label><input id="token" /></div>
    <div>
      <label>Poll interval (ms)</label>
      <input type="number" id="poll-interval" value="2000" min="500" />
    </div>
    <div><label>Packet loss threshold (%)</label><input type="number" id="th-loss" value="5" /></div>
    <div><label>RTT threshold (ms)</label><input type="number" id="th-rtt" value="200" /></div>
  </div>

  <div class="row">
    <button id="btn-join">Join Room</button>
    <button id="btn-leave" disabled>Leave Room</button>
  </div>

  <!-- REQUIRED: the SDK publishes from and previews into the element with id="red5pro-publisher". -->
  <video id="red5pro-publisher" autoplay playsinline muted></video>

  <div id="quality-bar">
    <h3>Overall Network Quality</h3>
    <div class="bar-track"><div class="bar-fill" id="quality-fill"></div></div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="name">Outbound Bitrate</div>
      <div class="value good" id="s-bitrate">—<span class="unit">kbps</span></div>
    </div>
    <div class="stat-card">
      <div class="name">Round Trip Time</div>
      <div class="value good" id="s-rtt">—<span class="unit">ms</span></div>
    </div>
    <div class="stat-card">
      <div class="name">Packet Loss</div>
      <div class="value good" id="s-loss">—<span class="unit">%</span></div>
    </div>
    <div class="stat-card">
      <div class="name">Jitter</div>
      <div class="value good" id="s-jitter">—<span class="unit">ms</span></div>
    </div>
    <div class="stat-card">
      <div class="name">Frame Rate</div>
      <div class="value good" id="s-fps">—<span class="unit">fps</span></div>
    </div>
    <div class="stat-card">
      <div class="name">Packets Sent</div>
      <div class="value good" id="s-packets">—</div>
    </div>
  </div>

  <div id="issues-box">
    <h3>&#x26A0; Issues Detected</h3>
    <div id="issues-list"></div>
  </div>

  <div id="log"></div>

  <!-- PubNub first: the Conference SDK expects a global `PubNub` (used for chat and file transfer). -->
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.10.2.5.min.js"></script>
  <!-- The Conference SDK bundle already includes the Red5 WebRTC SDK; no separate script is needed. -->
  <script src="https://cdn.jsdelivr.net/npm/red5pro-conference-sdk@1/red5pro-conference-sdk.min.js"></script>
  <script>
    const { ConferenceClient, ConferenceEvents } = red5proConferenceSdk;

    const $ = id => document.getElementById(id);
    let client = null;
    let myUserId = '';

    function log(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `log-${type}`;
      el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      $('log').appendChild(el);
      $('log').scrollTop = $('log').scrollHeight;
    }

    async function startLocalMedia() {
      const media = client.mediaStreamManager;
      const cameraStream = await media.getMediaStream(true, true);
      media.setOriginalStream(cameraStream);
      media.setCurrentStream(cameraStream);
      const localStream = media.getCurrentStream();
      $('red5pro-publisher').srcObject = localStream;
      return localStream;
    }

    // join() resolves before the connection is made, so failures arrive as events.
    function watchJoinFailures(onFailure) {
      client.on(ConferenceEvents.PUBLISH_FAILED, ({ error }) => onFailure(`Publish failed: ${error}`));
      client.on(ConferenceEvents.CONNECT_FAIL,   () => onFailure('Could not connect to the server'));
      client.on(ConferenceEvents.PUBLISH_FAIL,   () => onFailure('The server rejected the stream'));
      client.on(ConferenceEvents.JOIN_FAILED,    ({ statusCode, error }) => onFailure(`Join failed: ${error || `status ${statusCode}`}`));
      client.on(ConferenceEvents.JOIN_BLOCKED,   () => onFailure('Join blocked: you are not allowed in this room'));
    }

    function quality(val, warnThr, badThr, invert = false) {
      if (val === null || val === undefined) return '';
      if (invert) return val > badThr ? 'bad' : val > warnThr ? 'warn' : 'good';
      return val < badThr ? 'bad' : val < warnThr ? 'warn' : 'good';
    }

    function setStat(id, value, cls, unit = '') {
      const el = $(id);
      el.innerHTML = value !== null ? `${value}${unit ? `<span class="unit">${unit}</span>` : ''}` : '—';
      el.className = `value ${cls}`;
    }

    // Quality scores are 1 (critical) to 5 (excellent); 0 means no connection of that kind yet.
    function updateQualityBar(score) {
      const pct = Math.round((score / 5) * 100);
      const fill = $('quality-fill');
      fill.style.width = `${pct}%`;
      fill.style.background = pct > 70 ? '#3fb950' : pct > 40 ? '#f0883e' : '#f85149';
    }

    function renderIssues(issues) {
      if (!issues.length) {
        $('issues-box').style.display = 'none';
        return;
      }
      $('issues-box').style.display = '';
      $('issues-list').innerHTML = issues
        .map(i => `<div>• [${i.statsSample.severity}] ${i.statsSample.connectionId}: ${i.statsSample.description}</div>`)
        .join('');
    }

    function resetUi() {
      $('red5pro-publisher').srcObject = null;
      ['s-bitrate','s-rtt','s-loss','s-jitter','s-fps','s-packets'].forEach(id => {
        $(id).innerHTML = '—'; $(id).className = 'value';
      });
      updateQualityBar(0);
      $('issues-box').style.display = 'none';
      $('btn-join').disabled  = false;
      $('btn-leave').disabled = true;
    }

    async function handleJoinFailure(message) {
      log(message, 'error');
      await client?.mediaStreamManager.cleanupMediaStreams();
      client = null;
      resetUi();
    }

    $('btn-join').addEventListener('click', async () => {
      const host     = $('host').value.trim();
      const roomId   = $('room-id').value.trim();
      const token    = $('token').value.trim();
      const interval = parseInt($('poll-interval').value, 10) || 2000;
      const thLoss   = parseFloat($('th-loss').value) || 5;
      const thRtt    = parseFloat($('th-rtt').value) || 200;
      myUserId       = $('user-id').value.trim() || `user-${Date.now()}`;

      if (!host) { log('Host is required', 'error'); return; }
      $('btn-join').disabled = true;

      try {
        client = new ConferenceClient({
          host,
          statsPollingInterval: interval,
          packetLossThreshold:  thLoss,
          rttThreshold:         thRtt
        });
        watchJoinFailures(handleJoinFailure);

        // Stats collection starts automatically once the publisher connection is up.
        client.on(ConferenceEvents.USER_PUBLISHED, () => {
          log('Publishing — stats monitoring active', 'success');
          $('btn-leave').disabled = false;
        });

        // Every poll: { inbound, outbound, statsSamples: { [connectionId]: sample } }.
        // Connection ids are stream names, so the publisher's id is your userId.
        client.on(ConferenceEvents.NETWORK_SCORES_UPDATED, ({ outbound, statsSamples }) => {
          updateQualityBar(outbound);

          const mine = statsSamples[myUserId];
          if (!mine) return;
          const kbps = mine.bitrate / 1000;           // bitrate is bits per second
          setStat('s-bitrate', Math.round(kbps),          quality(kbps, 500, 100), 'kbps');
          setStat('s-rtt',     Math.round(mine.rtt),      quality(mine.rtt, thRtt / 2, thRtt, true), 'ms');
          setStat('s-loss',    mine.packetLossPct.toFixed(1), quality(mine.packetLossPct, thLoss / 2, thLoss, true), '%');
          setStat('s-jitter',  Math.round(mine.avgJitter), quality(mine.avgJitter, 25, 50, true), 'ms');
          setStat('s-fps',     Math.round(mine.framesPerSecond || 0), quality(mine.framesPerSecond, 20, 10), 'fps');

          // Raw RTCStats-derived values are available per connection.
          const packets = client.getConnectionStats(myUserId).current?.outboundVideo?.packetsSent;
          if (packets !== undefined) setStat('s-packets', packets.toLocaleString(), 'good');

          // Clear the panel once the monitor no longer reports any issues.
          if (!client.getCurrentWebRTCIssues().length) renderIssues([]);
        });

        // Only emitted when something is wrong: [{ type, reason, statsSample: { connectionId,
        // value, threshold, description, severity } }]
        client.on(ConferenceEvents.WEBRTC_ISSUES_DETECTED, issues => {
          renderIssues(issues);
          log(`Issues detected: ${issues.map(i => i.reason).join(', ')}`, 'error');
        });

        const localStream = await startLocalMedia();
        log('Joining room…');
        await client.join(roomId, myUserId, token, 'publisher', localStream, true, true);
      } catch (err) {
        await handleJoinFailure(`Error: ${err.message}`);
      }
    });

    $('btn-leave').addEventListener('click', async () => {
      try {
        await client.leave();
        client.cleanupChat(); // leave() does not close the PubNub subscription
        client = null;
        resetUi();
        log('Left room');
      } catch (err) {
        log(`Leave error: ${err.message}`, 'error');
      }
    });
  </script>
</body>
</html>
