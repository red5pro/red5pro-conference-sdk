<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>09 – Guest Management | Red5 Pro Conference SDK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; padding: 24px; }
    h1 { font-size: 1.25rem; margin-bottom: 4px; }
    p.subtitle { color: #8b949e; font-size: 0.875rem; margin-bottom: 24px; }

    .config { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 640px; margin-bottom: 20px; }
    label { font-size: 0.8rem; color: #8b949e; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px 10px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 0.875rem; }

    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
    button { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 600; transition: opacity .15s; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #btn-join  { background: #238636; color: #fff; }
    #btn-leave { background: #da3633; color: #fff; }

    .layout { display: flex; gap: 16px; max-width: 900px; flex-wrap: wrap; }

    video { width: 240px; height: 135px; background: #161b22; border-radius: 8px; object-fit: cover; display: block; }

    .panel { flex: 1; min-width: 280px; }
    .panel h3 { font-size: 0.85rem; color: #8b949e; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .badge-count { background: #da3633; color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 0.72rem; }

    #waiting-list, #participants-list { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 8px; min-height: 100px; display: flex; flex-direction: column; gap: 6px; }

    .user-card { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #21262d; border-radius: 6px; }
    .user-card .name { font-size: 0.875rem; }
    .user-card .role { font-size: 0.7rem; color: #8b949e; margin-top: 2px; }
    .card-actions { display: flex; gap: 6px; }
    .approve-btn { padding: 4px 10px; background: #238636; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: 600; }
    .reject-btn  { padding: 4px 10px; background: #da3633; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: 600; }
    .empty-hint  { font-size: 0.78rem; color: #484f58; text-align: center; padding: 20px 0; }

    #log { margin-top: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.78rem; max-width: 900px; }
    .log-info    { color: #8be9fd; }
    .log-success { color: #50fa7b; }
    .log-error   { color: #ff5555; }
    .log-warn    { color: #f0883e; }
  </style>
</head>
<body>
  <h1>09 – Guest Management</h1>
  <p class="subtitle">Host view: approve or reject guests waiting to join the conference room.</p>

  <div class="config">
    <div><label>Host</label><input id="host" placeholder="your-deployment.cloud.red5.net" /></div>
    <div><label>Room ID</label><input id="room-id" value="testroom" /></div>
    <div>
      <label>Your Role</label>
      <select id="role">
        <option value="admin">Admin (Host)</option>
        <option value="publisher">Publisher (Host)</option>
        <option value="guest">Guest</option>
      </select>
    </div>
    <div><label>User ID</label><input id="user-id" placeholder="host" /></div>
    <div><label>Token</label><input id="token" /></div>
  </div>

  <div class="row">
    <button id="btn-join">Join Room</button>
    <button id="btn-leave" disabled>Leave Room</button>
  </div>

  <div class="layout">
    <!-- REQUIRED: the SDK publishes from and previews into the element with id="red5pro-publisher". -->
    <video id="red5pro-publisher" autoplay playsinline muted></video>

    <div class="panel">
      <h3>Waiting Room <span class="badge-count" id="waiting-count" style="display:none">0</span></h3>
      <div id="waiting-list">
        <div class="empty-hint">No guests waiting</div>
      </div>
    </div>

    <div class="panel">
      <h3>Participants</h3>
      <div id="participants-list">
        <div class="empty-hint">No other participants</div>
      </div>
    </div>
  </div>

  <div id="log"></div>

  <!-- PubNub first: the Conference SDK expects a global `PubNub` (used for chat and file transfer). -->
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.10.2.5.min.js"></script>
  <!-- The Conference SDK bundle already includes the Red5 WebRTC SDK; no separate script is needed. -->
  <script src="https://cdn.jsdelivr.net/npm/red5pro-conference-sdk@1/red5pro-conference-sdk.min.js"></script>
  <script>
    const { ConferenceClient, ConferenceEvents } = red5proConferenceSdk;

    const $ = id => document.getElementById(id);
    let client = null;
    let myRole = '';
    const waitingGuests = new Map();
    const participants  = new Map();

    function log(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `log-${type}`;
      el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      $('log').appendChild(el);
      $('log').scrollTop = $('log').scrollHeight;
    }

    async function startLocalMedia() {
      const media = client.mediaStreamManager;
      const cameraStream = await media.getMediaStream(true, true);
      media.setOriginalStream(cameraStream);
      media.setCurrentStream(cameraStream);
      const localStream = media.getCurrentStream();
      $('red5pro-publisher').srcObject = localStream;
      return localStream;
    }

    // join() resolves before the connection is made, so failures arrive as events.
    function watchJoinFailures(onFailure) {
      client.on(ConferenceEvents.PUBLISH_FAILED, ({ error }) => onFailure(`Publish failed: ${error}`));
      client.on(ConferenceEvents.CONNECT_FAIL,   () => onFailure('Could not connect to the server'));
      client.on(ConferenceEvents.PUBLISH_FAIL,   () => onFailure('The server rejected the stream'));
      client.on(ConferenceEvents.JOIN_FAILED,    ({ statusCode, error }) => onFailure(`Join failed: ${error || `status ${statusCode}`}`));
      // For a guest, JOIN_BLOCKED means the host rejected the request.
      client.on(ConferenceEvents.JOIN_BLOCKED,   () => onFailure(myRole === 'guest'
        ? 'The host rejected your join request'
        : 'Join blocked: you are not allowed in this room'));
    }

    function renderWaiting() {
      const list = $('waiting-list');
      const badge = $('waiting-count');
      if (waitingGuests.size === 0) {
        list.innerHTML = '<div class="empty-hint">No guests waiting</div>';
        badge.style.display = 'none';
        return;
      }
      badge.style.display = '';
      badge.textContent = waitingGuests.size;
      list.innerHTML = '';
      waitingGuests.forEach((guest, uid) => {
        const card = document.createElement('div');
        card.className = 'user-card';
        card.innerHTML = `
          <div><div class="name"></div><div class="role">Guest</div></div>
          <div class="card-actions">
            <button class="approve-btn">Approve</button>
            <button class="reject-btn">Reject</button>
          </div>`;
        card.querySelector('.name').textContent = uid;
        card.querySelector('.approve-btn').addEventListener('click', () => decide(uid, true));
        card.querySelector('.reject-btn').addEventListener('click', () => decide(uid, false));
        list.appendChild(card);
      });
    }

    function decide(uid, approve) {
      // Sends the decision over the data channel. An approved guest then appears
      // through NEW_PARTICIPANT like anyone else.
      if (approve) client.approveGuest(uid);
      else         client.rejectGuest(uid);
      waitingGuests.delete(uid);
      renderWaiting();
      log(`${approve ? 'Approved' : 'Rejected'} guest: ${uid}`, approve ? 'success' : 'info');
    }

    function renderParticipants() {
      const list = $('participants-list');
      if (participants.size === 0) {
        list.innerHTML = '<div class="empty-hint">No other participants</div>';
        return;
      }
      list.innerHTML = '';
      participants.forEach((user, uid) => {
        const card = document.createElement('div');
        card.className = 'user-card';
        card.innerHTML = '<div><div class="name"></div><div class="role"></div></div>';
        card.querySelector('.name').textContent = uid;
        card.querySelector('.role').textContent = user.role || 'publisher';
        list.appendChild(card);
      });
    }

    function resetUi() {
      $('red5pro-publisher').srcObject = null;
      waitingGuests.clear(); participants.clear();
      renderWaiting(); renderParticipants();
      $('btn-join').disabled  = false;
      $('btn-leave').disabled = true;
    }

    async function handleJoinFailure(message) {
      log(message, 'error');
      await client?.mediaStreamManager.cleanupMediaStreams();
      client = null;
      resetUi();
    }

    $('btn-join').addEventListener('click', async () => {
      const host   = $('host').value.trim();
      const roomId = $('room-id').value.trim();
      const userId = $('user-id').value.trim() || `user-${Date.now()}`;
      const token  = $('token').value.trim();
      myRole       = $('role').value;

      if (!host) { log('Host is required', 'error'); return; }
      $('btn-join').disabled = true;

      try {
        client = new ConferenceClient({ host });
        watchJoinFailures(handleJoinFailure);

        // For a guest this only fires after a host approves the request.
        // `participants` and `guestsWaitingApproval` are objects keyed by uid.
        client.on(ConferenceEvents.USER_PUBLISHED, ({ participants: others, guestsWaitingApproval }) => {
          log(`Joined as ${myRole}`, 'success');
          $('btn-leave').disabled = false;
          Object.values(others).forEach(user => participants.set(user.uid, user));
          Object.values(guestsWaitingApproval || {}).forEach(guest => waitingGuests.set(guest.uid, guest));
          renderParticipants();
          renderWaiting();
        });

        // Delivered to hosts in the room: { streamName, ... }
        client.on(ConferenceEvents.GUEST_JOIN_REQUEST, request => {
          log(`Guest join request from: ${request.streamName}`);
          waitingGuests.set(request.streamName, request);
          renderWaiting();
        });

        client.on(ConferenceEvents.NEW_PARTICIPANT, ({ participant }) => {
          participants.set(participant.uid, participant);
          waitingGuests.delete(participant.uid);
          renderParticipants();
          renderWaiting();
          log(`Participant joined: ${participant.uid}`);
        });

        client.on(ConferenceEvents.PARTICIPANT_DISCONNECTED, ({ participant }) => {
          participants.delete(participant.uid);
          renderParticipants();
          log(`Participant left: ${participant.uid}`);
        });

        const localStream = await startLocalMedia();
        log(myRole === 'guest' ? 'Requesting to join — waiting for a host to approve…' : `Joining as ${myRole}…`);
        await client.join(roomId, userId, token, myRole, localStream, true, true);
        // Let a waiting guest cancel the request.
        if (myRole === 'guest') $('btn-leave').disabled = false;
      } catch (err) {
        await handleJoinFailure(`Error: ${err.message}`);
      }
    });

    $('btn-leave').addEventListener('click', async () => {
      try {
        await client.leave();
        client.cleanupChat(); // leave() does not close the PubNub subscription
        client = null;
        resetUi();
        log('Left room');
      } catch (err) {
        log(`Leave error: ${err.message}`, 'error');
      }
    });
  </script>
</body>
</html>
