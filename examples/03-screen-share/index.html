<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>03 – Screen Share | Red5 Pro Conference SDK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; padding: 24px; }
    h1 { font-size: 1.25rem; margin-bottom: 4px; }
    p.subtitle { color: #8b949e; font-size: 0.875rem; margin-bottom: 24px; }

    .config { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 480px; margin-bottom: 20px; }
    label { font-size: 0.8rem; color: #8b949e; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 10px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 0.875rem; }

    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    button { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 600; transition: opacity .15s; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #btn-join   { background: #238636; color: #fff; }
    #btn-leave  { background: #da3633; color: #fff; }
    #btn-screen { background: #1f6feb; color: #fff; }
    #btn-screen.active { background: #da3633; }

    .videos { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
    .video-tile { position: relative; }
    .video-tile video { width: 320px; height: 180px; background: #161b22; border-radius: 8px; object-fit: cover; display: block; }
    .video-tile .label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,.6); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; }

    #options { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; max-width: 400px; margin-bottom: 20px; }
    #options h3 { font-size: 0.85rem; color: #8b949e; margin-bottom: 10px; }
    .opt-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.85rem; }
    .opt-row input[type=number] { width: 80px; }
    .opt-row input[type=checkbox] { width: auto; }

    #log { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; height: 160px; overflow-y: auto; font-family: monospace; font-size: 0.78rem; }
    .log-info    { color: #8be9fd; }
    .log-success { color: #50fa7b; }
    .log-error   { color: #ff5555; }
  </style>
</head>
<body>
  <h1>03 – Screen Share</h1>
  <p class="subtitle">Join a room, then start/stop sharing your screen as a second stream.</p>

  <div class="config">
    <div><label>Host</label><input id="host" placeholder="your-deployment.cloud.red5.net" /></div>
    <div><label>Room ID</label><input id="room-id" value="testroom" /></div>
    <div><label>User ID</label><input id="user-id" placeholder="alice" /></div>
    <div><label>Token</label><input id="token" /></div>
  </div>

  <div id="options">
    <h3>Screen Share Options</h3>
    <div class="opt-row">
      <label>Screen share token</label>
      <input type="text" id="screen-token" placeholder="Token for &lt;userId&gt;-screenshare (if required)" />
    </div>
    <div class="opt-row">
      <label>Include audio</label>
      <input type="checkbox" id="opt-audio" checked />
    </div>
    <div class="opt-row">
      <label>Max width</label>
      <input type="number" id="opt-width" value="1920" />
    </div>
    <div class="opt-row">
      <label>Max height</label>
      <input type="number" id="opt-height" value="1080" />
    </div>
    <div class="opt-row">
      <label>Frame rate</label>
      <input type="number" id="opt-fps" value="30" />
    </div>
  </div>

  <div class="row">
    <button id="btn-join">Join Room</button>
    <button id="btn-screen" disabled>Start Screen Share</button>
    <button id="btn-leave" disabled>Leave Room</button>
  </div>

  <div class="videos">
    <div class="video-tile">
      <!-- REQUIRED: the SDK publishes from and previews into the element with id="red5pro-publisher". -->
      <video id="red5pro-publisher" autoplay playsinline muted></video>
      <div class="label">Camera</div>
    </div>
    <div class="video-tile" id="screen-tile" style="display:none">
      <!-- REQUIRED for screen share: the SDK previews the shared screen into this element. -->
      <video id="red5pro-publisher-screenshare" autoplay playsinline muted></video>
      <div class="label">Screen</div>
    </div>
  </div>

  <div id="log"></div>

  <!-- PubNub first: the Conference SDK expects a global `PubNub` (used for chat and file transfer). -->
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.10.2.5.min.js"></script>
  <!-- The Conference SDK bundle already includes the Red5 WebRTC SDK; no separate script is needed. -->
  <script src="https://cdn.jsdelivr.net/npm/red5pro-conference-sdk@1/red5pro-conference-sdk.min.js"></script>
  <script>
    const { ConferenceClient, ConferenceEvents } = red5proConferenceSdk;

    const $ = id => document.getElementById(id);
    let client = null;
    let sharing = false;

    function log(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `log-${type}`;
      el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      $('log').appendChild(el);
      $('log').scrollTop = $('log').scrollHeight;
    }

    async function startLocalMedia() {
      const media = client.mediaStreamManager;
      const cameraStream = await media.getMediaStream(true, true);
      media.setOriginalStream(cameraStream);
      media.setCurrentStream(cameraStream);
      const localStream = media.getCurrentStream();
      $('red5pro-publisher').srcObject = localStream;
      return localStream;
    }

    // join() resolves before the connection is made, so failures arrive as events.
    function watchJoinFailures(onFailure) {
      client.on(ConferenceEvents.PUBLISH_FAILED, ({ error }) => onFailure(`Publish failed: ${error}`));
      client.on(ConferenceEvents.CONNECT_FAIL,   () => onFailure('Could not connect to the server'));
      client.on(ConferenceEvents.PUBLISH_FAIL,   () => onFailure('The server rejected the stream'));
      client.on(ConferenceEvents.JOIN_FAILED,    ({ statusCode, error }) => onFailure(`Join failed: ${error || `status ${statusCode}`}`));
      client.on(ConferenceEvents.JOIN_BLOCKED,   () => onFailure('Join blocked: you are not allowed in this room'));
    }

    function showSharing(active) {
      sharing = active;
      $('btn-screen').textContent = active ? 'Stop Screen Share' : 'Start Screen Share';
      $('btn-screen').classList.toggle('active', active);
      $('screen-tile').style.display = active ? '' : 'none';
    }

    function resetUi() {
      $('red5pro-publisher').srcObject = null;
      $('red5pro-publisher-screenshare').srcObject = null;
      showSharing(false);
      $('btn-join').disabled   = false;
      $('btn-leave').disabled  = true;
      $('btn-screen').disabled = true;
    }

    async function handleJoinFailure(message) {
      log(message, 'error');
      await client?.mediaStreamManager.cleanupMediaStreams();
      client = null;
      resetUi();
    }

    $('btn-join').addEventListener('click', async () => {
      const host   = $('host').value.trim();
      const roomId = $('room-id').value.trim();
      const userId = $('user-id').value.trim() || `user-${Date.now()}`;
      const token  = $('token').value.trim();

      if (!host) { log('Host is required', 'error'); return; }
      $('btn-join').disabled = true;

      try {
        client = new ConferenceClient({ host });
        watchJoinFailures(handleJoinFailure);

        client.on(ConferenceEvents.USER_PUBLISHED, () => {
          log('Publishing camera', 'success');
          $('btn-leave').disabled  = false;
          $('btn-screen').disabled = false;
        });

        // Fires once when the screen stream is published ({ streamName, stream }) and again
        // when the server accepts it into the room ({ uid }). The SDK renders the preview
        // into #red5pro-publisher-screenshare itself.
        client.on(ConferenceEvents.SCREEN_SHARE_STARTED, ({ streamName, uid }) => {
          if (!sharing) log(`Screen share started as ${streamName || uid}`, 'success');
          showSharing(true);
        });

        // Also fires when the user clicks the browser's own "Stop sharing" button.
        client.on(ConferenceEvents.SCREEN_SHARE_STOPPED, () => {
          log('Screen share stopped');
          $('red5pro-publisher-screenshare').srcObject = null;
          showSharing(false);
        });

        // startScreenShare() reports most failures (including a cancelled picker) here
        // instead of rejecting.
        client.on(ConferenceEvents.SCREEN_SHARE_FAILED, ({ error }) => {
          log(`Screen share failed: ${error}`, 'error');
          showSharing(false);
        });

        const localStream = await startLocalMedia();
        log('Joining room…');
        await client.join(roomId, userId, token, 'publisher', localStream, true, true);
      } catch (err) {
        await handleJoinFailure(`Error: ${err.message}`);
      }
    });

    $('btn-screen').addEventListener('click', async () => {
      if (!client) return;
      try {
        if (sharing) {
          await client.stopScreenShare();
        } else {
          await client.startScreenShare({
            // The screen share joins the room as its own participant, "<userId>-screenshare".
            // If your deployment enforces tokens, pass a token issued for that uid.
            token: $('screen-token').value.trim(),
            includeAudio: $('opt-audio').checked,
            width:  parseInt($('opt-width').value,  10),
            height: parseInt($('opt-height').value, 10),
            frameRate: parseInt($('opt-fps').value, 10)
          });
        }
      } catch (err) {
        log(`Screen share toggle error: ${err.message}`, 'error');
      }
    });

    $('btn-leave').addEventListener('click', async () => {
      try {
        // leave() also stops an active screen share.
        await client.leave();
        client.cleanupChat(); // leave() does not close the PubNub subscription
        client = null;
        resetUi();
        log('Left room');
      } catch (err) {
        log(`Leave error: ${err.message}`, 'error');
      }
    });
  </script>
</body>
</html>
