<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>01 – Basic Join | Red5 Pro Conference SDK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; padding: 24px; }
    h1 { font-size: 1.25rem; margin-bottom: 4px; }
    p.subtitle { color: #8b949e; font-size: 0.875rem; margin-bottom: 24px; }

    .config { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 640px; margin-bottom: 20px; }
    label { font-size: 0.8rem; color: #8b949e; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 10px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 0.875rem; }

    .controls { display: flex; gap: 10px; margin-bottom: 24px; }
    button { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 600; transition: opacity .15s; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #btn-join  { background: #238636; color: #fff; }
    #btn-leave { background: #da3633; color: #fff; }

    #status { font-size: 0.875rem; color: #8b949e; margin-bottom: 20px; }
    #status.connected { color: #3fb950; }
    #status.error     { color: #f85149; }

    #video-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .video-tile { position: relative; width: 320px; }
    .video-tile video { width: 100%; height: 180px; background: #161b22; border-radius: 8px; object-fit: cover; display: block; }
    .video-tile .label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,.6); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; }

    #log { margin-top: 24px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; height: 180px; overflow-y: auto; font-family: monospace; font-size: 0.78rem; }
    .log-info    { color: #8be9fd; }
    .log-success { color: #50fa7b; }
    .log-error   { color: #ff5555; }
  </style>
</head>
<body>
  <h1>01 – Basic Join</h1>
  <p class="subtitle">Join a room, publish camera + mic, subscribe to everyone else in the room, then leave.</p>

  <div class="config">
    <div>
      <label>Host</label>
      <input id="host" placeholder="your-deployment.cloud.red5.net" />
    </div>
    <div>
      <label>Room ID</label>
      <input id="room-id" value="testroom" />
    </div>
    <div>
      <label>User ID</label>
      <input id="user-id" placeholder="alice" />
    </div>
    <div>
      <label>Token</label>
      <input id="token" placeholder="Conference token (JWT) for this user, room and role" />
    </div>
  </div>

  <div class="controls">
    <button id="btn-join">Join Room</button>
    <button id="btn-leave" disabled>Leave Room</button>
  </div>

  <p id="status">Not connected</p>

  <div id="video-grid">
    <div class="video-tile">
      <!-- REQUIRED: the SDK publishes from and previews into the element with id="red5pro-publisher". -->
      <video id="red5pro-publisher" autoplay playsinline muted></video>
      <div class="label">You</div>
    </div>
  </div>
  <div id="log"></div>

  <!-- PubNub first: the Conference SDK expects a global `PubNub` (used for chat and file transfer). -->
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.10.2.5.min.js"></script>
  <!-- The Conference SDK bundle already includes the Red5 WebRTC SDK; no separate script is needed. -->
  <script src="https://cdn.jsdelivr.net/npm/red5pro-conference-sdk@1/red5pro-conference-sdk.min.js"></script>
  <script>
    const { ConferenceClient, ConferenceEvents } = red5proConferenceSdk;

    const $ = id => document.getElementById(id);
    let client = null;

    function log(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `log-${type}`;
      el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      $('log').appendChild(el);
      $('log').scrollTop = $('log').scrollHeight;
    }

    function setStatus(text, cls = '') {
      $('status').textContent = text;
      $('status').className = cls;
    }

    // Remote participants: the SDK does not render them. Attach each MediaStream yourself.
    function addRemoteTile(uid, stream) {
      let tile = $(`tile-${uid}`);
      if (!tile) {
        tile = document.createElement('div');
        tile.className = 'video-tile';
        tile.id = `tile-${uid}`;
        const video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = uid;
        tile.append(video, label);
        $('video-grid').appendChild(tile);
      }
      tile.querySelector('video').srcObject = stream;
    }

    function removeRemoteTile(uid) {
      $(`tile-${uid}`)?.remove();
    }

    function resetUi() {
      document.querySelectorAll('[id^="tile-"]').forEach(tile => tile.remove());
      $('red5pro-publisher').srcObject = null;
      $('btn-join').disabled = false;
      $('btn-leave').disabled = true;
    }

    async function subscribeTo(participant) {
      try {
        // Resolves before media arrives; the stream is delivered by SUBSCRIBE_SUCCESS.
        await client.subscribe(participant);
      } catch (err) {
        log(`Subscribe to ${participant.uid} failed: ${err.message}`, 'error');
      }
    }

    async function handleJoinFailure(message) {
      log(message, 'error');
      setStatus('Join failed', 'error');
      await client?.mediaStreamManager.cleanupMediaStreams();
      client = null;
      resetUi();
    }

    $('btn-join').addEventListener('click', async () => {
      const host   = $('host').value.trim();
      const roomId = $('room-id').value.trim();
      const userId = $('user-id').value.trim() || `user-${Date.now()}`;
      const token  = $('token').value.trim();

      if (!host) { log('Host is required', 'error'); return; }
      $('btn-join').disabled = true;

      try {
        client = new ConferenceClient({ host });

        // Joined. `participants` holds everyone who was already in the room (keyed by uid).
        client.on(ConferenceEvents.USER_PUBLISHED, ({ participants }) => {
          log(`Joined room "${roomId}" as ${userId}`, 'success');
          setStatus('Connected – publishing', 'connected');
          $('btn-leave').disabled = false;
          Object.values(participants).forEach(subscribeTo);
        });

        // Someone joined after us.
        client.on(ConferenceEvents.NEW_PARTICIPANT, ({ participant }) => {
          log(`New participant: ${participant.uid}`);
          subscribeTo(participant);
        });

        // Remote media is ready to render.
        client.on(ConferenceEvents.SUBSCRIBE_SUCCESS, ({ uid, mediaStream }) => {
          log(`Receiving ${uid}`, 'success');
          addRemoteTile(uid, mediaStream);
        });

        client.on(ConferenceEvents.SUBSCRIBE_FAILED, ({ user, error }) => {
          log(`Subscribe failed for ${user?.uid}: ${error?.type || error}`, 'error');
        });

        // The SDK unsubscribes automatically; only the UI needs cleaning up.
        client.on(ConferenceEvents.PARTICIPANT_DISCONNECTED, ({ participant }) => {
          log(`Participant left: ${participant.uid}`);
          removeRemoteTile(participant.uid);
        });

        // join() resolves before the connection is made, so failures arrive as events.
        client.on(ConferenceEvents.PUBLISH_FAILED, ({ error }) => handleJoinFailure(`Publish failed: ${error}`));
        client.on(ConferenceEvents.CONNECT_FAIL,   () => handleJoinFailure('Could not connect to the server'));
        client.on(ConferenceEvents.PUBLISH_FAIL,   () => handleJoinFailure('The server rejected the stream'));
        client.on(ConferenceEvents.JOIN_FAILED,    ({ statusCode, error }) => handleJoinFailure(`Join failed: ${error || `status ${statusCode}`} (check the token's uid, roomId and role)`));
        client.on(ConferenceEvents.JOIN_BLOCKED,   () => handleJoinFailure('Join blocked: you are not allowed in this room'));

        // Let the SDK own the local stream so mute, device switching, noise suppression
        // and recording all act on the same tracks.
        log('Requesting camera + microphone…');
        const media = client.mediaStreamManager;
        const cameraStream = await media.getMediaStream(true, true);
        media.setOriginalStream(cameraStream);
        media.setCurrentStream(cameraStream);
        const localStream = media.getCurrentStream();
        $('red5pro-publisher').srcObject = localStream;

        setStatus('Joining…');
        log('Joining room…');
        await client.join(roomId, userId, token, 'publisher', localStream, true, true);
      } catch (err) {
        await handleJoinFailure(`Error: ${err.message}`);
      }
    });

    $('btn-leave').addEventListener('click', async () => {
      try {
        // Stops publishing, unsubscribes everyone and releases the camera and microphone.
        await client.leave();
        client.cleanupChat(); // leave() does not close the PubNub subscription
        client = null;
        resetUi();
        setStatus('Not connected');
        log('Left room');
      } catch (err) {
        log(`Leave error: ${err.message}`, 'error');
      }
    });
  </script>
</body>
</html>
