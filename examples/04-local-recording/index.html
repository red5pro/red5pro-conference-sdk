<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>04 – Local Recording | Red5 Pro Conference SDK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; padding: 24px; }
    h1 { font-size: 1.25rem; margin-bottom: 4px; }
    p.subtitle { color: #8b949e; font-size: 0.875rem; margin-bottom: 24px; }

    .config { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 480px; margin-bottom: 20px; }
    label { font-size: 0.8rem; color: #8b949e; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px 10px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 0.875rem; }

    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    button { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 600; transition: opacity .15s; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #btn-join     { background: #238636; color: #fff; }
    #btn-leave    { background: #da3633; color: #fff; }
    #btn-record   { background: #1f6feb; color: #fff; }
    #btn-record.recording { background: #da3633; }
    #btn-pause    { background: #6e40c9; color: #fff; }
    #btn-download { background: #238636; color: #fff; }

    video { width: 320px; height: 180px; background: #161b22; border-radius: 8px; object-fit: cover; display: block; margin-bottom: 16px; }

    #rec-status { display: flex; align-items: center; gap: 10px; font-size: 0.875rem; margin-bottom: 16px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #30363d; }
    .dot.active { background: #f85149; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

    #stats-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; font-family: monospace; font-size: 0.8rem; margin-bottom: 20px; max-width: 340px; }
    #stats-box div { display: flex; justify-content: space-between; padding: 2px 0; }
    #stats-box span { color: #3fb950; }

    #log { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.78rem; }
    .log-info    { color: #8be9fd; }
    .log-success { color: #50fa7b; }
    .log-error   { color: #ff5555; }
  </style>
</head>
<body>
  <h1>04 – Local Recording</h1>
  <p class="subtitle">Record the local camera stream and download it as a WebM file or ZIP archive.</p>

  <div class="config">
    <div><label>Host</label><input id="host" placeholder="your-deployment.cloud.red5.net" /></div>
    <div><label>Room ID</label><input id="room-id" value="testroom" /></div>
    <div><label>User ID</label><input id="user-id" placeholder="alice" /></div>
    <div><label>Token</label><input id="token" /></div>
    <div>
      <label>MIME type</label>
      <select id="mime">
        <option value="">Auto-detect</option>
        <option value="video/webm;codecs=vp9">video/webm (VP9)</option>
        <option value="video/webm;codecs=vp8">video/webm (VP8)</option>
        <option value="video/mp4">video/mp4</option>
      </select>
    </div>
  </div>

  <div class="row">
    <button id="btn-join">Join Room</button>
    <button id="btn-leave" disabled>Leave Room</button>
  </div>

  <!-- REQUIRED: the SDK publishes from and previews into the element with id="red5pro-publisher". -->
  <video id="red5pro-publisher" autoplay playsinline muted></video>

  <div id="rec-status">
    <div class="dot" id="rec-dot"></div>
    <span id="rec-label">Idle</span>
  </div>

  <div id="stats-box">
    <div>Chunks recorded <span id="s-chunks">0</span></div>
    <div>Total size <span id="s-size">0 B</span></div>
    <div>Duration <span id="s-dur">0s</span></div>
  </div>

  <div class="row">
    <button id="btn-record" disabled>Start Recording</button>
    <button id="btn-pause"  disabled>Pause</button>
    <button id="btn-download" disabled>Download ZIP</button>
  </div>

  <div id="log"></div>

  <!-- PubNub first: the Conference SDK expects a global `PubNub` (used for chat and file transfer). -->
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.10.2.5.min.js"></script>
  <!-- The Conference SDK bundle already includes the Red5 WebRTC SDK; no separate script is needed. -->
  <script src="https://cdn.jsdelivr.net/npm/red5pro-conference-sdk@1/red5pro-conference-sdk.min.js"></script>
  <script>
    // The script-tag (UMD) build needs setImmediate for ZIP generation; browsers don't provide it.
    window.setImmediate = window.setImmediate || ((fn, ...args) => setTimeout(fn, 0, ...args));

    const { ConferenceClient, ConferenceEvents } = red5proConferenceSdk;

    const $ = id => document.getElementById(id);
    let client = null;
    let isRecording = false;
    let isPaused = false;
    let recordingStartedAt = 0;
    let statsTimer = null;

    function log(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `log-${type}`;
      el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      $('log').appendChild(el);
      $('log').scrollTop = $('log').scrollHeight;
    }

    async function startLocalMedia() {
      const media = client.mediaStreamManager;
      const cameraStream = await media.getMediaStream(true, true);
      media.setOriginalStream(cameraStream);
      media.setCurrentStream(cameraStream);
      const localStream = media.getCurrentStream();
      $('red5pro-publisher').srcObject = localStream;
      return localStream;
    }

    // join() resolves before the connection is made, so failures arrive as events.
    function watchJoinFailures(onFailure) {
      client.on(ConferenceEvents.PUBLISH_FAILED, ({ error }) => onFailure(`Publish failed: ${error}`));
      client.on(ConferenceEvents.CONNECT_FAIL,   () => onFailure('Could not connect to the server'));
      client.on(ConferenceEvents.PUBLISH_FAIL,   () => onFailure('The server rejected the stream'));
      client.on(ConferenceEvents.JOIN_FAILED,    ({ statusCode, error }) => onFailure(`Join failed: ${error || `status ${statusCode}`}`));
      client.on(ConferenceEvents.JOIN_BLOCKED,   () => onFailure('Join blocked: you are not allowed in this room'));
    }

    function formatBytes(b) {
      if (b < 1024) return `${b} B`;
      if (b < 1048576) return `${(b/1024).toFixed(1)} KB`;
      return `${(b/1048576).toFixed(2)} MB`;
    }

    function updateStats() {
      if (!client) return;
      // { isRecording, isPaused, chunks, segments, estimatedSize, state }
      const s = client.getLocalRecordingStatus();
      $('s-chunks').textContent = s.chunks;
      $('s-size').textContent   = formatBytes(s.estimatedSize);
      $('s-dur').textContent    = recordingStartedAt ? `${Math.floor((Date.now() - recordingStartedAt) / 1000)}s` : '0s';
    }

    function resetUi() {
      clearInterval(statsTimer);
      $('red5pro-publisher').srcObject = null;
      isRecording = false; isPaused = false; recordingStartedAt = 0;
      $('rec-dot').classList.remove('active');
      $('rec-label').textContent = 'Idle';
      $('btn-join').disabled     = false;
      $('btn-leave').disabled    = true;
      $('btn-record').disabled   = true;
      $('btn-pause').disabled    = true;
      $('btn-download').disabled = true;
      $('btn-record').textContent = 'Start Recording';
      $('btn-record').classList.remove('recording');
      $('btn-pause').textContent = 'Pause';
    }

    async function handleJoinFailure(message) {
      log(message, 'error');
      await client?.mediaStreamManager.cleanupMediaStreams();
      client = null;
      resetUi();
    }

    $('btn-join').addEventListener('click', async () => {
      const host   = $('host').value.trim();
      const roomId = $('room-id').value.trim();
      const userId = $('user-id').value.trim() || `user-${Date.now()}`;
      const token  = $('token').value.trim();

      if (!host) { log('Host is required', 'error'); return; }
      $('btn-join').disabled = true;

      try {
        client = new ConferenceClient({ host });
        watchJoinFailures(handleJoinFailure);

        client.on(ConferenceEvents.USER_PUBLISHED, () => {
          log('Publishing — recorder ready', 'success');
          $('btn-leave').disabled  = false;
          $('btn-record').disabled = false;
        });

        // Informational: the room has local recording turned on. The SDK does not
        // enforce this flag; your app decides whether to offer recording.
        client.on(ConferenceEvents.LOCAL_RECORDING_ENABLED, () => log('Local recording is enabled for this room'));

        client.on(ConferenceEvents.LOCAL_RECORDING_STARTED, ({ mimeType }) => {
          log(`Recording started (${mimeType})`, 'success');
          recordingStartedAt = Date.now();
          $('rec-dot').classList.add('active');
          $('rec-label').textContent = 'Recording';
          $('btn-pause').disabled    = false;
          $('btn-download').disabled = false;
          statsTimer = setInterval(updateStats, 500);
        });

        client.on(ConferenceEvents.LOCAL_RECORDING_STOPPED, ({ size }) => {
          log(`Recording stopped (${formatBytes(size)})`);
          $('rec-dot').classList.remove('active');
          $('rec-label').textContent = 'Stopped';
          $('btn-pause').disabled = true;
          clearInterval(statsTimer);
          updateStats();
        });

        client.on(ConferenceEvents.LOCAL_RECORDING_PAUSED, () => {
          log('Recording paused');
          $('rec-dot').classList.remove('active');
          $('rec-label').textContent = 'Paused';
          $('btn-pause').textContent = 'Resume';
          isPaused = true;
        });

        client.on(ConferenceEvents.LOCAL_RECORDING_RESUMED, () => {
          log('Recording resumed');
          $('rec-dot').classList.add('active');
          $('rec-label').textContent = 'Recording';
          $('btn-pause').textContent = 'Pause';
          isPaused = false;
        });

        client.on(ConferenceEvents.LOCAL_RECORDING_DOWNLOADED, ({ filename, size }) => {
          log(`Downloaded ${filename} (${formatBytes(size)})`, 'success');
        });

        client.on(ConferenceEvents.LOCAL_RECORDING_ERROR, ({ error }) => {
          log(`Recording error: ${error?.message || error}`, 'error');
        });

        const localStream = await startLocalMedia();
        log('Joining room…');
        await client.join(roomId, userId, token, 'publisher', localStream, true, true);
      } catch (err) {
        await handleJoinFailure(`Error: ${err.message}`);
      }
    });

    $('btn-record').addEventListener('click', () => {
      if (!client) return;
      if (isRecording) {
        client.stopLocalRecording();
        isRecording = false;
        isPaused = false;
        $('btn-record').textContent = 'Start Recording';
        $('btn-record').classList.remove('recording');
        $('btn-pause').textContent = 'Pause';
      } else {
        // Passing no stream records the SDK's current local stream, so a camera switch or
        // video mute starts a new segment instead of stopping the recording.
        const mime = $('mime').value || undefined;
        client.startLocalRecording(undefined, 1000, mime);
        isRecording = client.getLocalRecordingStatus().isRecording;
        if (isRecording) {
          $('btn-record').textContent = 'Stop Recording';
          $('btn-record').classList.add('recording');
        }
      }
    });

    $('btn-pause').addEventListener('click', () => {
      if (!client) return;
      if (isPaused) client.resumeLocalRecording();
      else          client.pauseLocalRecording();
    });

    $('btn-download').addEventListener('click', async () => {
      if (!client) return;
      try {
        log('Generating ZIP download…');
        // The ZIP holds recording.webm (or part1.webm, part2.webm… if the camera changed),
        // a JSON chunk index per file, and screen-recording-N.webm for any screen share.
        const ok = await client.downloadLocalRecording('my-recording');
        if (!ok) log('No recording data to download', 'error');
      } catch (err) {
        log(`Download error: ${err.message}`, 'error');
      }
    });

    $('btn-leave').addEventListener('click', async () => {
      try {
        // leave() stops an active recording; download first if you want to keep it.
        await client.leave();
        client.cleanupChat(); // leave() does not close the PubNub subscription
        client = null;
        resetUi();
        log('Left room');
      } catch (err) {
        log(`Leave error: ${err.message}`, 'error');
      }
    });
  </script>
</body>
</html>
